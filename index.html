<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手話まんがワープロ 70</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --ink:#222; --sub:#666; --line:#d9dce5;
    --accent:#3f51b5; --soft:#eef0ff; --warn:#fff4d6;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px}
  header h1{font-size:20px;margin:0 0 4px}
  header .status{font-size:13px;color:var(--sub)}
  main{max-width:1100px;margin:auto;padding:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:18px;resize:vertical}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{border:0;border-radius:9px;padding:10px 14px;font-size:15px;cursor:pointer;background:var(--accent);color:#fff}
  button.secondary{background:#eef0f4;color:#222;border:1px solid var(--line)}
  button.danger{background:#a83a3a}
  .wordbank{display:flex;flex-wrap:wrap;gap:7px;max-height:220px;overflow:auto;padding-top:8px}
  .chip{background:var(--soft);color:#25308b;border:1px solid #d4d8ff;border-radius:999px;padding:7px 10px;font-size:14px;cursor:pointer}
  .chip:hover{filter:brightness(.97)}
  .count{font-weight:700}
  .hint{font-size:13px;color:var(--sub);margin-top:6px}
  .notice{background:var(--warn);border:1px solid #ead89c;border-radius:10px;padding:10px;font-size:13px;margin-top:10px}
  #output{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
  .sign-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card-head{padding:10px 12px;background:#fafbff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .word{font-size:22px;font-weight:700}
  .seq{font-size:12px;color:var(--sub)}
  .comic{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .frame{background:#fff;min-height:145px;padding:8px;display:flex;flex-direction:column;justify-content:space-between}
  .frame-title{font-size:12px;font-weight:700;color:#555}
  .drawing{height:95px;display:flex;align-items:center;justify-content:center}
  .caption{font-size:12px;line-height:1.35;color:#444}
  .desc{padding:10px 12px}
  .desc b{display:block;margin-bottom:4px}
  .desc p{margin:0;font-size:14px;line-height:1.55}
  .unknown{background:#fff0f0;border:1px solid #efb6b6;padding:10px;border-radius:10px;margin:5px 0;font-size:14px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:200px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:15px}
  footer{font-size:12px;color:var(--sub);padding:8px 0 30px}
  @media(max-width:600px){main{padding:10px}.frame{min-height:130px}.word{font-size:20px}}
</style>
</head>
<body>
<header>
  <h1>手話まんがワープロ 70</h1>
  <div class="status">対応ワード数：<span class="count" id="supportedCount">70</span>語 ／ 漫画4コマ＋動作説明</div>
</header>

<main>
  <section class="panel">
    <h2 style="font-size:17px;margin:0 0 8px">文章を入力</h2>
    <textarea id="input" placeholder="例：こんにちは ありがとう わたし あなた たべる のむ"></textarea>
    <div class="btnrow">
      <button id="convertBtn">手話漫画に変換</button>
      <button id="clearBtn" class="secondary">クリア</button>
      <button id="demoBtn" class="secondary">例文</button>
      <button id="printBtn" class="secondary">印刷</button>
      <button id="speakInputBtn" class="secondary">🔊 入力ワードを読み上げ</button>
    </div>
    <div class="hint">スペース・読点・句点・改行で区切ります。対応語をクリックして入力もできます。</div>
    <div class="notice">
      このアプリは学習用の試作です。手話には地域差・世代差・表現差があります。実際の学習では、ろう者・手話通訳者・公的教材などで動きを確認してください。
    </div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <h2 style="font-size:17px;margin:0">対応70ワード</h2>
      <input id="search" class="search" placeholder="対応ワードを検索">
    </div>
    <div id="wordbank" class="wordbank"></div>
  </section>

  <section class="panel">
    <h2 style="font-size:17px;margin:0 0 10px">変換結果</h2>
    <div id="unknowns"></div>
    <div id="output"></div>
  </section>

  <footer>
    1ファイル版。画像ファイル不要。漫画はHTML/CSS/SVGで表示します。
  </footer>
</main>

<script>
const signs = [
["こんにちは","両手を胸の前で構え、相手に向けてあいさつする流れを意識します。"],
["おはよう","朝を表す動きのあと、あいさつの表現につなげます。"],
["こんばんは","夜を表す動きのあと、あいさつの表現につなげます。"],
["ありがとう","利き手をもう一方の手の甲付近から前上方へ動かし、感謝を表します。"],
["ごめん","顔の前付近で手を使い、謝罪の気持ちを表す動きにします。"],
["はい","うなずきと合わせて、肯定を示す簡潔な動きにします。"],
["いいえ","手や頭の動きで否定を示します。"],
["わたし","自分の胸元を指し、自分自身を示します。"],
["あなた","相手の方向をやさしく指して示します。"],
["ひと","人の存在を示す手形を使って表現します。"],
["ともだち","両手を使い、人と人とのつながりを示すように表現します。"],
["かぞく","複数の人がまとまるイメージで両手を動かします。"],
["おとうさん","男性・父を示す位置や手形を使って表現します。"],
["おかあさん","女性・母を示す位置や手形を使って表現します。"],
["こども","子どもを示す高さや小ささを意識した手の動きを使います。"],
["なまえ","名前をたずねたり示したりする表現として、指や手を組み合わせます。"],
["なに","手のひらや指を使い、疑問を表す表情と一緒に示します。"],
["どこ","場所を探すように手を左右へ動かし、疑問の表情を添えます。"],
["いつ","時間・時点をたずねる表現として、手首や指を使う動きをします。"],
["だれ","人をたずねる疑問表現として、指差しと疑問の表情を使います。"],
["これ","近くの物を指して示します。"],
["それ","相手側にある物を指して示します。"],
["ここ","自分の近くの場所を下向きに指して示します。"],
["そこ","相手側の場所を指して示します。"],
["いく","両手または指を進行方向へ動かし、移動を表します。"],
["くる","外側から自分の方へ手を動かし、こちらへ来ることを表します。"],
["かえる","元の場所へ戻るイメージで手を自分側へ返します。"],
["ある","存在することを示すように手を置く・示す動きをします。"],
["ない","手を払うような動きなどで、不在・不存在を示します。"],
["みる","目元から見る対象へ向けて指や手を動かします。"],
["きく","耳の付近で手を使い、聞くことを示します。"],
["はなす","口元から前方へ手を動かし、話すことを表します。"],
["よむ","目線と手の動きを使い、文字を追うイメージを表します。"],
["かく","片手を筆記具に見立て、もう一方の手の上で書く動きをします。"],
["たべる","指先または手を口元へ運び、食べる動作を表します。"],
["のむ","コップを持つような手形で口元へ運び、飲む動作を表します。"],
["ねる","両手や頭を使い、枕で眠るイメージを表します。"],
["おきる","眠っている状態から上体が起きるイメージで手を動かします。"],
["やすむ","動きを止めて休むイメージを手で示します。"],
["はたらく","両手を使い、仕事・作業をすることを表す動きにします。"],
["べんきょう","両手を使い、本や学習をする様子を表します。"],
["がっこう","学ぶ場所を示す表現として、学習の動きと場所の表現を組み合わせます。"],
["いえ","屋根や建物の形をイメージして両手で表します。"],
["みせ","商品や売買の場所を示す動きを組み合わせます。"],
["えき","電車・交通の場所を示す動きを組み合わせます。"],
["びょういん","医療・診察を表す手の動きと場所表現を組み合わせます。"],
["トイレ","トイレを示す定型の手形・動きを使います。"],
["みず","水を示す手の形や流れをイメージした動きで表現します。"],
["おちゃ","飲み物を示す動きと、お茶を区別する手の表現を使います。"],
["ごはん","食事・米飯を示す手の動きを使います。"],
["パン","パンの形や切るイメージを使った手の動きで表現します。"],
["おいしい","頬や口元付近で、おいしさを示す表情と手の動きを使います。"],
["すき","胸元付近で好意を示す動きと表情を使います。"],
["きらい","好みでないことを示す手の動きと表情を使います。"],
["うれしい","胸元付近で喜びを表すように手を動かし、表情も明るくします。"],
["かなしい","顔や胸元で悲しさを示す動きと表情を使います。"],
["いたい","痛む場所を示し、指先や表情で痛みを表現します。"],
["つかれた","肩や体の力が落ちるイメージを手と表情で示します。"],
["あつい","顔の近くから熱を払うような動きを使い、暑さを示します。"],
["さむい","体を縮めるような動きや震えを使い、寒さを示します。"],
["おおきい","両手の間隔を広げ、大きさを示します。"],
["ちいさい","両手の間隔を狭くして、小ささを示します。"],
["たかい","手を高い位置へ上げ、高さを示します。"],
["やすい","価格が下がるイメージを手の動きで示します。"],
["はやい","手を素早く動かし、速さを表します。"],
["おそい","手をゆっくり動かし、遅さを表します。"],
["きょう","自分の近くの位置で現在・今日を示す時間表現を使います。"],
["あした","時間が先へ進むイメージで、前方へ手を動かします。"],
["きのう","時間が過去へ戻るイメージで、後方を意識した動きをします。"],
["だいじょうぶ","胸元付近で安心・問題なしを示す動きをします。"]
];

const supported = new Map(signs);
const bank = document.getElementById("wordbank");
const input = document.getElementById("input");
const output = document.getElementById("output");
const unknowns = document.getElementById("unknowns");
document.getElementById("supportedCount").textContent = signs.length;

function addWord(word){
  input.value += (input.value.trim() ? " " : "") + word;
  input.focus();
}
function renderBank(filter=""){
  bank.innerHTML="";
  signs.filter(x=>x[0].includes(filter)).forEach(([w])=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=w; b.type="button";
    b.onclick=()=>addWord(w);
    bank.appendChild(b);
  });
}
renderBank();

function personSVG(step){
  const handX = [48,35,65,50][step-1];
  const handY = [54,45,45,35][step-1];
  return `
  <svg viewBox="0 0 100 100" width="120" height="95" aria-label="手話動作イメージ">
    <circle cx="50" cy="20" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="50" y1="30" x2="50" y2="64" stroke="currentColor" stroke-width="2"/>
    <line x1="50" y1="40" x2="${handX}" y2="${handY}" stroke="currentColor" stroke-width="3"/>
    <line x1="50" y1="40" x2="${100-handX}" y2="${handY}" stroke="currentColor" stroke-width="3"/>
    <line x1="50" y1="64" x2="38" y2="88" stroke="currentColor" stroke-width="2"/>
    <line x1="50" y1="64" x2="62" y2="88" stroke="currentColor" stroke-width="2"/>
    <circle cx="${handX}" cy="${handY}" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="${100-handX}" cy="${handY}" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
    ${step>1?'<path d="M25 55 Q20 45 28 37" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 3"/>':''}
    ${step>2?'<path d="M75 55 Q80 45 72 37" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 3"/>':''}
  </svg>`;
}
function splitDesc(desc){
  const chunks = desc.split("、");
  return [
    "準備：相手から見える位置に手を出します。",
    chunks[0] || "手の形を作ります。",
    chunks[1] || "決められた方向へ手を動かします。",
    "仕上げ：表情と視線を合わせて意味を伝えます。"
  ];
}
function makeCard(word, desc, idx){
  const steps=splitDesc(desc);
  const card=document.createElement("article");
  card.className="sign-card";
  card.innerHTML=`
    <div class="card-head"><span class="word">${word}</span><span class="seq">${idx+1}</span></div>
    <div class="comic">
      ${steps.map((s,i)=>`
        <div class="frame">
          <div class="frame-title">${i+1}コマ目</div>
          <div class="drawing">${personSVG(i+1)}</div>
          <div class="caption">${s}</div>
        </div>`).join("")}
    </div>
    <div class="desc"><b>動作説明</b><p>${desc}</p></div>`;
  return card;
}

function tokenize(text){
  return text
    .replace(/[。、，,.!?！？\n\r\t]+/g," ")
    .split(/\s+/)
    .map(x=>x.trim())
    .filter(Boolean);
}
function speak(text){
  if(!("speechSynthesis" in window)){
    alert("このブラウザは音声読み上げに対応していません。");
    return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ja-JP";
  u.rate=0.9;
  u.pitch=1.0;
  speechSynthesis.speak(u);
}

function convert(){
  output.innerHTML=""; unknowns.innerHTML="";
  const words=tokenize(input.value);
  const unknown=[];
  words.forEach((w,i)=>{
    if(supported.has(w)) output.appendChild(makeCard(w,supported.get(w),i));
    else unknown.push(w);
  });
  if(!words.length){
    unknowns.innerHTML='<div class="hint">文章を入力して「手話漫画に変換」を押してください。</div>';
  }else if(unknown.length){
    unknowns.innerHTML=`<div class="unknown"><b>未対応ワード：</b> ${[...new Set(unknown)].join("、")}</div>`;
  }
}
document.getElementById("convertBtn").onclick=convert;
document.getElementById("clearBtn").onclick=()=>{input.value="";output.innerHTML="";unknowns.innerHTML="";};
document.getElementById("demoBtn").onclick=()=>{input.value="こんにちは わたし あなた ともだち ありがとう";convert();};
document.getElementById("printBtn").onclick=()=>window.print();
document.getElementById("search").addEventListener("input",e=>renderBank(e.target.value.trim()));
document.getElementById("speakInputBtn").onclick=()=>{
  const words=tokenize(input.value);
  if(!words.length){ alert("ワードを入力してください。"); return; }
  speak(words.join("、"));
};
</script>
</body>
</html>
